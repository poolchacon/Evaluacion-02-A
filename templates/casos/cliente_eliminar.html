{% extends 'casos/base.html' %}

{% block titulo %}Eliminar cliente{% endblock %}

{% block contenido %}
<h1>Eliminar cliente</h1>
<p>¿Seguro que deseas eliminar a <strong>{{ cliente.nombres }}</strong>?</p>
{% if error %}
    <p class="error">{{ error }}</p>
{% endif %}
<form method="post">
    {% csrf_token %}
    <button class="btn btn-rojo" type="submit">Sí, eliminar</button>
    <a href="{% url 'casos:clientes_lista' %}">Cancelar</a>
</form>
{% endblock %}
